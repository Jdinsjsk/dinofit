name: Construire l'APK DinoFit

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests (calculs, rangs, pas)
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --stacktrace

      - name: Construire l'APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Renommer
        run: cp app/build/outputs/apk/release/app-release.apk DinoFit.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DinoFit-apk
          path: DinoFit.apk

      # Publie aussi l'APK dans l'onglet « Releases » : téléchargeable directement depuis le téléphone.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: DinoFit 2.0.${{ github.run_number }}
          files: DinoFit.apk
